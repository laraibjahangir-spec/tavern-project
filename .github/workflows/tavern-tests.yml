name: Tavern API Tests

on:
  push:
    branches: [ main, posts ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: :contentReference[oaicite:0]{index=0}@v4

      - name: Set up Python
        uses: :contentReference[oaicite:1]{index=1}@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest tavern pytest-html jsonschema

      - name: Run Tavern tests
        run: |
          pytest -v --html=report.html --self-contained-html

      - name: Upload report
        uses: :contentReference[oaicite:2]{index=2}@v4
        with:
          name: tavern-report
          path: report.html